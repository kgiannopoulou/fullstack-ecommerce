# Render Blueprint for a Stripe test-mode demo: Postgres + API + storefront.
# Step-by-step instructions (and the values marked sync: false) are in
# docs/DEPLOY.md.
databases:
  - name: shop-db
    plan: free
    databaseName: shop
    user: shop

services:
  - type: web
    name: shop-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SEED_DEMO
        value: "true"
      # Render's load balancer + the storefront's /api proxy.
      - key: TRUST_PROXY
        value: 2
      - key: STRIPE_SECRET_KEY # sk_test_... from the Stripe dashboard (test mode)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # whsec_... from the webhook endpoint you create
        sync: false
      - key: CLIENT_URL # https://shop-web-XXXX.onrender.com
        sync: false
      - key: CORS_ORIGIN # same as CLIENT_URL
        sync: false
      - key: SMTP_URL # optional, e.g. smtp://user:pass@smtp.example.com:587
        sync: false

  - type: web
    name: shop-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Empty: the browser calls /api on the storefront's own origin, which
      # proxies to the API (see frontend/next.config.ts).
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: API_PROXY_TARGET # https://shop-api-XXXX.onrender.com (needed at build time)
        sync: false
      - key: API_INTERNAL_URL # same as API_PROXY_TARGET
        sync: false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Separate, throwaway database for `npm test` (wiped on every run).
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5437:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Catches verification and password-reset emails: open http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  pgdata:
